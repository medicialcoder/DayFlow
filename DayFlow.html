  render();
}

/* ═══════════════════════════════════════════════
   Sort mode
═══════════════════════════════════════════════ */
function toggleSortMode() {
  sortMode = sortMode === 'priority' ? 'manual' : 'priority';
  localStorage.setItem('df_sortMode', sortMode);
  updateSortBadge();
  render();
}

function updateSortBadge() {
  const badge = document.getElementById('sortBadge');
  if (!badge) return;
  if (sortMode === 'manual') {
    badge.textContent = '↕ 自定义排序';
    badge.classList.remove('is-default');
  } else {
    badge.textContent = '☰ 优先级排序';
    badge.classList.add('is-default');
  }
}

/* ═══════════════════════════════════════════════
   Drag and Drop
═══════════════════════════════════════════════ */
function onDragStart(event, id) {
  if (catFilter !== 'all') { event.preventDefault(); return; }
  _dragId = id;
  event.dataTransfer.effectAllowed = 'move';
  requestAnimationFrame(() => {
    const el = document.querySelector(`.task-card[data-id="${id}"]`);
    if (el) el.classList.add('is-dragging');
  });
}

function onDragOver(event, id) {
  if (!_dragId || _dragId === id) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.task-card').forEach(el => el.classList.remove('drag-over'));
  const el = document.querySelector(`.task-card[data-id="${id}"]`);
  if (el) el.classList.add('drag-over');
}

function onDrop(event, id) {
  event.preventDefault();
  if (!_dragId || _dragId === id) return;
  const fromIdx = tasks.findIndex(t => t.id === _dragId);
  const toIdx   = tasks.findIndex(t => t.id === id);
  if (fromIdx < 0 || toIdx < 0) return;
  const [moved] = tasks.splice(fromIdx, 1);
  tasks.splice(toIdx, 0, moved);
  if (sortMode !== 'manual') {
    sortMode = 'manual';
    localStorage.setItem('df_sortMode', 'manual');
    updateSortBadge();
  }
  saveTasks();
  render();
}

function onDragEnd() {
  _dragId = null;
  document.querySelectorAll('.task-card').forEach(el => {
    el.classList.remove('is-dragging', 'drag-over');
  });
}

/* ═══════════════════════════════════════════════
   Pomodoro
═══════════════════════════════════════════════ */
function togglePomodoro() {
  _pomoOpen = !_pomoOpen;
  document.getElementById('pomoPanel').classList.toggle('is-open', _pomoOpen);
}

function setPomoMode(mins) {
  if (_pomoRunning) return;
  _pomoMinutes = mins;
  _pomoTotal   = mins * 60;
  _pomoTime    = _pomoTotal;
  document.querySelectorAll('.pomo-mode-btn').forEach(b => b.classList.remove('is-active'));
  const btn = document.getElementById(`pomoMode${mins}`);
  if (btn) btn.classList.add('is-active');
  updatePomoDisplay();
  document.getElementById('pomoLabel').textContent = '准备开始';
  document.getElementById('pomoDisplay').classList.remove('is-running', 'is-done');
}

function togglePomo() {
  if (_pomoRunning) pausePomo(); else startPomo();
}

function startPomo() {
  if (_pomoTime <= 0) resetPomoTimer();
  _pomoRunning = true;
  const startBtn = document.getElementById('pomoStartBtn');
  startBtn.textContent = '⏸ 暂停';
  document.getElementById('pomoLabel').textContent = '专注中…';
  document.getElementById('pomoDisplay').classList.add('is-running');
  document.getElementById('pomoDisplay').classList.remove('is-done');
  _pomoInterval = setInterval(() => {
    _pomoTime--;
    updatePomoDisplay();
    if (_pomoTime <= 0) pomoComplete();
  }, 1000);
}

function pausePomo() {
  _pomoRunning = false;
  clearInterval(_pomoInterval);
  document.getElementById('pomoStartBtn').textContent = '▶ 继续';
  document.getElementById('pomoLabel').textContent = '已暂停';
  document.getElementById('pomoDisplay').classList.remove('is-running');
}

function resetPomo() {
  clearInterval(_pomoInterval);
  _pomoRunning = false;
  resetPomoTimer();
  document.getElementById('pomoStartBtn').textContent = '▶ 开始';
  document.getElementById('pomoLabel').textContent = '准备开始';
  document.getElementById('pomoDisplay').classList.remove('is-running', 'is-done');
}

function resetPomoTimer() {
  _pomoTime = _pomoTotal;
  updatePomoDisplay();
}

function pomoComplete() {
  clearInterval(_pomoInterval);
  _pomoRunning = false;
  _pomoSessions++;
  _pomoTime = 0;
  document.getElementById('pomoDisplay').textContent = '完成!';
  document.getElementById('pomoDisplay').classList.remove('is-running');
  document.getElementById('pomoDisplay').classList.add('is-done');
  document.getElementById('pomoLabel').textContent = `第 ${_pomoSessions} 个番茄完成 🎉`;
  document.getElementById('pomoStartBtn').textContent = '▶ 再来一个';
  document.getElementById('pomoFill').style.width = '100%';
  renderPomoSessions();
  toast(`🍅 第 ${_pomoSessions} 个番茄完成！休息一下~`);
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 1.0);
  } catch {}
}

function updatePomoDisplay() {
  const m = Math.floor(_pomoTime / 60);
  const s = _pomoTime % 60;
  const el = document.getElementById('pomoDisplay');
  if (el) el.textContent = `${pad(m)}:${pad(s)}`;
  const progress = (_pomoTotal - _pomoTime) / _pomoTotal;
  const fill = document.getElementById('pomoFill');
  if (fill) fill.style.width = (progress * 100) + '%';
}

function renderPomoSessions() {
  const el = document.getElementById('pomoSessions');
  if (!el) return;
  const max = 4;
  const mod = _pomoSessions % max;
  const filled = mod === 0 && _pomoSessions > 0 ? max : mod;
  el.innerHTML = Array.from({ length: max }, (_, i) =>
    `<div class="pomo-dot ${i < filled ? 'is-done' : ''}"></div>`
  ).join('');
}

function pomoStart(taskId) {
  _pomoTaskId = taskId;
  const t = tasks.find(t => t.id === taskId);
  if (t) document.getElementById('pomoTaskLbl').textContent = `📌 ${t.title}`;
  if (!_pomoOpen) togglePomodoro();
  resetPomo();
  startPomo();
  if (t) toast(`🍅 开始专注：${t.title}`);
}

/* ═══════════════════════════════════════════════
   Report (shared builder)
═══════════════════════════════════════════════ */
function buildReportFrom(dayTasks, dateStr) {
  const total   = dayTasks.length;
  const done    = dayTasks.filter(t => t.done).length;
  const pending = total - done;
  const pct     = total === 0 ? 0 : Math.round(done / total * 100);

  const completed = dayTasks
    .filter(t => t.done)
    .sort((a,b) => (a.doneAt||0) - (b.doneAt||0));

  const waiting = dayTasks
    .filter(t => !t.done)
    .sort((a,b) => PRI_META[a.pri].order - PRI_META[b.pri].order);

  const grouped = {};
  for (const t of completed) {
    (grouped[t.cat] = grouped[t.cat] || []).push(t);
  }

  const line = n => '─'.repeat(n);
  let r = '';

  r += `【日工作报告】${dateStr}\n`;
  r += line(50) + '\n\n';

  r += `任务统计\n`;
  r += `共安排 ${total} 项，已完成 ${done} 项，待完成 ${pending} 项，完成率 ${pct}%\n\n`;

  if (completed.length > 0) {
    r += `已完成工作（${done} 项）\n`;
    r += line(32) + '\n';
    let no = 1;
    for (const [cat, items] of Object.entries(grouped)) {
      const meta = CAT_META[cat];
      if (!meta) continue;
      r += `\n【${meta.label}】\n`;
      for (const t of items) {
        const ts  = t.doneAt ? `  [${fmtTs(t.doneAt)}]` : '';
        const dur = t.min    ? `（预计 ${fmtMin(t.min)}）` : '';
        r += `${no++}. ${t.title}${dur}${ts}\n`;
        if (t.notes) r += `   备注：${t.notes}\n`;
      }
    }
    r += '\n';
  }

  if (waiting.length > 0) {
    r += `待完成工作（${pending} 项）\n`;
    r += line(32) + '\n';
    waiting.forEach((t, i) => {
      const pri = t.pri === 'high' ? '[高]' : t.pri === 'medium' ? '[中]' : '[低]';
      const dur = t.min ? `（预计 ${fmtMin(t.min)}）` : '';
      r += `${i+1}. ${pri} ${t.title}${dur}\n`;
      if (t.notes) r += `   备注：${t.notes}\n`;
    });
    r += '\n';
  }

  r += `明日计划\n`;
  r += line(32) + '\n';
  r += `（请填写明日工作计划）\n\n`;

  r += `工作总结\n`;
  r += line(32) + '\n';
  if (pct === 100 && total > 0) {
    r += `当日 ${total} 项任务全部完成，工作效率良好。\n`;
  } else if (pct >= 80) {
    r += `当日任务基本完成，完成率 ${pct}%，进展顺利。\n`;
  } else if (pct >= 50) {
    r += `当日完成率 ${pct}%，有 ${pending} 项任务需继续跟进。\n`;
  } else if (total === 0) {
    r += `当日未添加任务。\n`;
  } else {
    r += `当日完成率 ${pct}%，请关注剩余 ${pending} 项待完成任务。\n`;
  }

  return r;
}

function buildReport() {
  return buildReportFrom(tasks, chineseDate());
}

/* ═══════════════════════════════════════════════
   History
═══════════════════════════════════════════════ */
let _histKey = null;

function parseKeyDate(key) {
  // key format: df_YYYY_M_D
  const [y, m, d] = key.slice(3).split('_').map(Number);
  const weekDays = ['日','一','二','三','四','五','六'];
  const weekDay  = weekDays[new Date(y, m-1, d).getDay()];
  return {
    y, m, d,
    label: `${m}月${d}日`,
    full:  `${y}年${m}月${d}日 星期${weekDay}`,
    sortKey: y * 10000 + m * 100 + d,
  };
}

function openHistory(preselect) {
  // Scan localStorage for past df_ keys only (exclude today and longterm)
  const todaySortKey = parseKeyDate(DKEY).sortKey;
  const entries = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith('df_') || key === DKEY || key === LKEY) continue;
    try {
      const t  = JSON.parse(localStorage.getItem(key) || '[]');
      const sk = parseKeyDate(key).sortKey;
      if (Array.isArray(t) && (sk < todaySortKey || key === preselect)) entries.push({ key, tasks: t });
    } catch { /* skip corrupted */ }
  }

  // Sort newest first
  const sorted = entries.sort((a, b) => parseKeyDate(b.key).sortKey - parseKeyDate(a.key).sortKey);

  // Reset right panel
  _histKey = null;
  document.getElementById('histRightTitle').textContent  = '选择左侧日期查看记录';
  document.getElementById('histEmpty').style.display     = 'flex';
  document.getElementById('histTaskList').style.display  = 'none';

  // Render day list
  const countEl = document.getElementById('histDayCount');
  const listEl  = document.getElementById('histDayList');

  countEl.textContent = `共 ${sorted.length} 天记录`;

  if (sorted.length === 0) {
    listEl.innerHTML = `
      <div style="text-align:center;color:var(--text3);padding:48px 16px;font-size:13px;line-height:1.6">
        暂无历史记录<br>完成今天的任务后<br>明天即可在此查看
      </div>`;
  } else {
    listEl.innerHTML = sorted.map(e => {
      const { label } = parseKeyDate(e.key);
      const total = e.tasks.length;
      const done  = e.tasks.filter(t => t.done).length;
      const pct   = total === 0 ? 0 : Math.round(done / total * 100);
      const safeId = e.key.replace(/_/g, '-');
      return `
        <div class="hist-day-item" id="hdi-${safeId}"
          onclick="selectHistDay('${e.key}')">
          <div class="hist-day-date">${label}</div>
          <div class="hist-day-stats">${done} / ${total} 项完成 · ${pct}%</div>
          <div class="hist-mini-bar">
            <div class="hist-mini-fill" style="width:${pct}%"></div>
          </div>
        </div>`;
    }).join('');
  }

  document.getElementById('histOverlay').classList.add('is-open');

  if (preselect) {
    setTimeout(() => selectHistDay(preselect), 50);
  }
}

function selectHistDay(key) {
  document.querySelectorAll('.hist-day-item').forEach(el => el.classList.remove('is-selected'));
  const safeId = key.replace(/_/g, '-');
  const item = document.getElementById(`hdi-${safeId}`);
  if (item) item.classList.add('is-selected');

  let dayTasks = [];
  try { dayTasks = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}

  const { full } = parseKeyDate(key);
  const done    = dayTasks.filter(t =>  t.done);
  const pending = dayTasks.filter(t => !t.done);

  document.getElementById('histRightTitle').textContent  = full;
  document.getElementById('histEmpty').style.display     = 'none';
  document.getElementById('histTaskList').style.display  = 'block';
  document.getElementById('histExportBtn').style.display = '';

  const listEl = document.getElementById('histTaskList');

  if (dayTasks.length === 0) {
    listEl.innerHTML = `<div style="text-align:center;color:var(--text3);padding:48px 0;font-size:13px">当天无任务记录</div>`;
    _histKey = key;
    return;
  }

  let html = '';
  if (done.length) {
    html += `<div class="hist-group-lbl">✅ 已完成 · ${done.length} 项</div>`;
    html += done.sort((a,b)=>(a.doneAt||0)-(b.doneAt||0)).map(histCardHTML).join('');
  }
  if (pending.length) {
    html += `<div class="hist-group-lbl">⏳ 未完成 · ${pending.length} 项</div>`;
    html += pending.sort((a,b)=>PRI_META[a.pri].order-PRI_META[b.pri].order).map(histCardHTML).join('');
  }
  listEl.innerHTML = html;
  _histKey = key;
}

function histCardHTML(t) {
  const cat = CAT_META[t.cat] || CAT_META.other;
  const pri = PRI_META[t.pri] || PRI_META.medium;
  const doneTs  = t.done && t.doneAt ? `<span class="task-done-ts">✓ ${fmtTs(t.doneAt)}</span>` : '';
  const timeStr = t.min ? `<span class="task-time">⏱ ${fmtMin(t.min)}</span>` : '';
  return `
    <div class="hist-task-card pri-${t.pri} ${t.done?'is-done':''}">
      <span class="hist-task-icon">${t.done ? '✅' : '⬜'}</span>
      <div class="hist-task-body">
        <div class="hist-task-title">${esc(t.title)}</div>
        <div class="hist-task-meta">
          <span class="tag tag-cat">${cat.icon} ${cat.label}</span>
          <span class="tag ${pri.tagClass}">${pri.label}优先级</span>
          ${timeStr}${doneTs}
        </div>
        ${t.notes ? `<div class="hist-task-notes">${esc(t.notes)}</div>` : ''}
      </div>
    </div>`;
}

function downloadHistReport() {
  if (!_histKey) return;
  let dayTasks = [];
  try { dayTasks = JSON.parse(localStorage.getItem(_histKey) || '[]'); } catch {}
  const { y, m, d, full } = parseKeyDate(_histKey);
  const text = buildReportFrom(dayTasks, full);
  const name = `日报_${y}${pad(m)}${pad(d)}.txt`;
  const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download: name
  });
  a.click();
  URL.revokeObjectURL(a.href);
  toast('⬇️ 日报已导出');
}

function closeHistory() {
  document.getElementById('histOverlay').classList.remove('is-open');
}

/* ═══════════════════════════════════════════════
   Report
═══════════════════════════════════════════════ */

function openReport() {
  document.getElementById('reportTa').value = buildReport();
  document.getElementById('reportOverlay').classList.add('is-open');
}

function closeReport() {
  document.getElementById('reportOverlay').classList.remove('is-open');
}

function regenerateReport() {
  if (confirm('重新生成将覆盖当前内容，是否继续？')) {
    document.getElementById('reportTa').value = buildReport();
    toast('🔄 日报已重新生成');
  }
}

function copyReport() {
  const text = document.getElementById('reportTa').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text)
      .then(() => toast('📋 日报已复制到剪贴板'))
      .catch(() => toast('❌ 复制失败，请手动选中复制'));
  } else {
    document.getElementById('reportTa').select();
    document.execCommand('copy');
    toast('📋 日报已复制到剪贴板');
  }
}

function downloadReport() {
  const text = document.getElementById('reportTa').value;
  const name = `日报_${NOW.getFullYear()}${pad(NOW.getMonth()+1)}${pad(NOW.getDate())}.txt`;
  const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download: name
  });
  a.click();
  URL.revokeObjectURL(a.href);
  toast('⬇️ 日报已导出');
}

/* ═══════════════════════════════════════════════
   Keyboard shortcuts
═══════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !e.isComposing) {
    // Close only the topmost open modal
    if (document.getElementById('editOverlay').classList.contains('is-open'))   { closeEdit();      return; }
    if (document.getElementById('reportOverlay').classList.contains('is-open')) { closeReport();    return; }
    if (document.getElementById('ltOverlay').classList.contains('is-open'))     { closeLongterm();  return; }
    if (document.getElementById('histOverlay').classList.contains('is-open'))   { closeHistory();   return; }
    closeForm();
  }
  // Ctrl/Cmd + Enter → submit add form
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    if (document.getElementById('addForm').classList.contains('is-open')) {
      submitTask();
    }
  }
});

/* ═══════════════════════════════════════════════
   Boot
═══════════════════════════════════════════════ */
loadTasks();
loadLongterm();
sortMode = localStorage.getItem('df_sortMode') || 'priority';
updateSortBadge();
renderPomoSessions();
render();

// Reload when the user returns on a new day
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const d = new Date();
  const liveKey = `df_${d.getFullYear()}_${d.getMonth()+1}_${d.getDate()}`;
  if (liveKey !== DKEY) location.reload();
});

// Sync across tabs
window.addEventListener('storage', e => {
  if (e.key === DKEY)  { loadTasks();    render(); }
  if (e.key === LKEY)  { loadLongterm(); render(); }
});
</script>

<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
