/* ═══════════════════════════════════════════════
   Stats & Weekly Report
═══════════════════════════════════════════════ */
let _statsTab    = 'stats';
let _statsRange  = 'week';
let _weekOffset  = 0;

function dKeyOf(date) {
  return `df_${date.getFullYear()}_${pad(date.getMonth()+1)}_${pad(date.getDate())}`;
}

function startOfDay(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function weekStartDate(date) {
  const d = startOfDay(date);
  const dow = d.getDay();
  const offset = dow === 0 ? -6 : 1 - dow;
  d.setDate(d.getDate() + offset);
  return d;
}

function getAllDayData() {
  const out = [];
  for (const key of _dfKeyCache) {
    if (!/^df_\d+_\d+_\d+$/.test(key)) continue;
    try {
      const dayTasks = JSON.parse(localStorage.getItem(key) || '[]');
      const [y, m, d] = key.slice(3).split('_').map(Number);
      out.push({
        key,
        date:    startOfDay(new Date(y, m - 1, d)),
        sortKey: y * 10000 + m * 100 + d,
        tasks:   dayTasks,
      });
    } catch {}
  }
  // Replace today's stored copy with the live in-memory tasks (which may not be persisted yet)
  const todayItem = out.find(x => x.key === DKEY);
  if (todayItem) todayItem.tasks = tasks;
  else if (tasks && tasks.length) {
    out.push({
      key:     DKEY,
      date:    startOfDay(NOW),
      sortKey: NOW.getFullYear() * 10000 + (NOW.getMonth() + 1) * 100 + NOW.getDate(),
      tasks:   tasks.slice(),
    });
  }
  out.sort((a, b) => a.sortKey - b.sortKey);
  return out;
}

function aggregate(items) {
  let total = 0, done = 0, totalMin = 0, doneMin = 0;
  const byCat = {};
  const byPri = {};
  const byDay = [];
  for (const item of items) {
    let dTotal = 0, dDone = 0;
    for (const t of item.tasks) {
      total++; if (t.done) done++;
      const m = +t.min || 0;
      totalMin += m;
      if (t.done) doneMin += m;
      const c = t.cat || 'other';
      byCat[c] = byCat[c] || { total: 0, done: 0 };
      byCat[c].total++; if (t.done) byCat[c].done++;
      const p = t.pri || 'medium';
      byPri[p] = byPri[p] || { total: 0, done: 0 };
      byPri[p].total++; if (t.done) byPri[p].done++;
      dTotal++; if (t.done) dDone++;
    }
    byDay.push({ date: item.date, total: dTotal, done: dDone });
  }
  return {
    total, done,
    pending: total - done,
    pct: total ? Math.round(done / total * 100) : 0,
    totalMin, doneMin,
    byCat, byPri, byDay,
  };
}

function openStats() {
  _statsTab = 'stats';
  setStatsTab('stats');
  document.getElementById('statsOverlay').classList.add('is-open');
}

function closeStats() {
  document.getElementById('statsOverlay').classList.remove('is-open');
}

function setStatsTab(tab) {
  _statsTab = tab;
  document.getElementById('statsTabBtn').classList.toggle('is-active', tab === 'stats');
  document.getElementById('weeklyTabBtn').classList.toggle('is-active', tab === 'weekly');
  document.getElementById('statsBody').style.display  = tab === 'stats'  ? '' : 'none';
  document.getElementById('weeklyBody').style.display = tab === 'weekly' ? '' : 'none';
  if (tab === 'stats') renderStats();
  else                 renderWeekly();
}

function setStatsRange(range) {
  _statsRange = range;
  document.querySelectorAll('.stats-range-btn[data-range]').forEach(b => {
    b.classList.toggle('is-active', b.dataset.range === range);
  });
  renderStats();
}

function setWeekOffset(off) {
  _weekOffset = parseInt(off, 10) || 0;
  document.querySelectorAll('.stats-range-btn[data-week]').forEach(b => {
    b.classList.toggle('is-active', parseInt(b.dataset.week, 10) === _weekOffset);
  });
  renderWeekly();
}

function renderStats() {
  const all   = getAllDayData();
  const today = startOfDay(NOW);
  let from = null;
  if (_statsRange === 'week')       from = weekStartDate(today);
  else if (_statsRange === 'month') from = new Date(today.getFullYear(), today.getMonth(), 1);

  const filtered = from ? all.filter(x => x.date >= from && x.date <= today) : all;
  const stats    = aggregate(filtered);

  const meta = document.getElementById('statsMeta');
  if (_statsRange === 'week') {
    const ws = weekStartDate(today);
    const we = new Date(ws); we.setDate(ws.getDate() + 6);
    meta.textContent = `${ws.getMonth()+1}/${ws.getDate()} - ${we.getMonth()+1}/${we.getDate()}`;
  } else if (_statsRange === 'month') {
    meta.textContent = `${today.getFullYear()}年${today.getMonth()+1}月`;
  } else {
    meta.textContent = filtered.length ? `共 ${filtered.length} 天记录` : '';
  }

  const root = document.getElementById('statsContent');
  if (stats.total === 0) {
    root.innerHTML = `
      <div class="stats-empty">
        <div class="stats-empty-icon">📭</div>
        <div class="stats-empty-h">该时段暂无任务记录</div>
        <div class="stats-empty-p">切换其他时段或先添加几个任务</div>
      </div>`;
    return;
  }

  let html = '';

  // KPI cards
  html += `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">总任务</div>
        <div class="kpi-value">${stats.total}</div>
        <div class="kpi-sub">已完成 ${stats.done} / 待完成 ${stats.pending}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">完成率</div>
        <div class="kpi-value">${stats.pct}%</div>
        <div class="kpi-sub">${stats.done} / ${stats.total} 项</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">预估总时长</div>
        <div class="kpi-value">${fmtMin(stats.totalMin) || '—'}</div>
        <div class="kpi-sub">${stats.totalMin ? '已完成 ' + (fmtMin(stats.doneMin) || '0分钟') : '未填写时长'}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">日均完成</div>
        <div class="kpi-value">${(stats.done / Math.max(filtered.length, 1)).toFixed(1)}</div>
        <div class="kpi-sub">${filtered.length} 天平均</div>
      </div>
    </div>`;

  // Category breakdown
  const catOrder  = Object.keys(CAT_META);
  const catTotals = catOrder.map(c => stats.byCat[c] ? stats.byCat[c].total : 0);
  const catMax    = Math.max(1, ...catTotals);
  html += `
    <div class="stats-section">
      <div class="stats-section-h">分类分布<span class="sub">已完成 / 总数</span></div>`;
  for (const c of catOrder) {
    const v    = stats.byCat[c] || { total: 0, done: 0 };
    const meta = CAT_META[c];
    const tw   = (v.total / catMax) * 100;
    const dw   = v.total ? (v.done / v.total) * tw : 0;
    html += `
      <div class="bar-row">
        <div class="bar-label">${meta.icon} ${meta.label}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${dw}%; background:${meta.color}"></div>
          <div class="bar-fill" style="width:${tw - dw}%; background:${meta.color}33"></div>
        </div>
        <div class="bar-count">${v.done} / ${v.total}</div>
      </div>`;
  }
  html += `</div>`;

  // Priority breakdown
  const priOrder = ['high', 'medium', 'low'];
  const priColors = { high: 'var(--red)', medium: 'var(--amber)', low: 'var(--green)' };
  const priTotals = priOrder.map(p => stats.byPri[p] ? stats.byPri[p].total : 0);
  const priMax    = Math.max(1, ...priTotals);
  html += `
    <div class="stats-section">
      <div class="stats-section-h">优先级分布<span class="sub">已完成 / 总数</span></div>`;
  for (const p of priOrder) {
    const v   = stats.byPri[p] || { total: 0, done: 0 };
    const lbl = PRI_META[p].label;
    const tw  = (v.total / priMax) * 100;
    const dw  = v.total ? (v.done / v.total) * tw : 0;
    html += `
      <div class="bar-row">
        <div class="bar-label">${lbl}优先级</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${dw}%; background:${priColors[p]}"></div>
          <div class="bar-fill" style="width:${tw - dw}%; background:${priColors[p]}33"></div>
        </div>
        <div class="bar-count">${v.done} / ${v.total}</div>
      </div>`;
  }
  html += `</div>`;

  // Daily trend (last 14 days within range, or all if range is small)
  const trendDays = _statsRange === 'all'
    ? Math.min(stats.byDay.length, 30)
    : (_statsRange === 'month' ? Math.min(stats.byDay.length, 31) : 7);
  let trendData;
  if (_statsRange === 'week') {
    const ws = weekStartDate(today);
    trendData = [];
    for (let i = 0; i < 7; i++) {
      const d   = new Date(ws); d.setDate(ws.getDate() + i);
      const day = stats.byDay.find(x => x.date.getTime() === d.getTime());
      trendData.push({ date: d, total: day ? day.total : 0, done: day ? day.done : 0 });
    }
  } else {
    const sorted = stats.byDay.slice().sort((a, b) => a.date - b.date);
    trendData = sorted.slice(-trendDays);
  }
  const trendMax = Math.max(1, ...trendData.map(x => x.total));
  const wkDays   = ['日', '一', '二', '三', '四', '五', '六'];
  html += `
    <div class="stats-section">
      <div class="stats-section-h">每日趋势<span class="sub">柱高=任务数 · 填充=完成率</span></div>
      <div class="trend-row">`;
  for (const d of trendData) {
    const h    = (d.total / trendMax) * 100;
    const fill = d.total ? (d.done / d.total) * 100 : 0;
    const pct  = d.total ? Math.round(d.done / d.total * 100) : 0;
    html += `
        <div class="trend-bar-wrap" title="${d.date.getMonth()+1}/${d.date.getDate()} · ${d.done}/${d.total}">
          <div class="trend-pct">${d.total ? pct + '%' : ''}</div>
          <div class="trend-bar" style="height:${Math.max(h, 2)}%">
            <div class="trend-bar-fill" style="height:${fill}%"></div>
          </div>
        </div>`;
  }
  html += `</div><div class="trend-labels">`;
  for (const d of trendData) {
    const lbl = _statsRange === 'week'
      ? `周${wkDays[d.date.getDay()]}`
      : `${d.date.getMonth()+1}/${d.date.getDate()}`;
    html += `<div class="trend-lbl-wrap">${lbl}</div>`;
  }
  html += `</div></div>`;

  root.innerHTML = html;
}

function renderWeekly() {
  const today = startOfDay(NOW);
  const ws    = weekStartDate(today);
  ws.setDate(ws.getDate() + _weekOffset * 7);
  const we = new Date(ws); we.setDate(ws.getDate() + 6);

  document.getElementById('statsMeta').textContent =
    `${ws.getFullYear()}.${ws.getMonth()+1}.${ws.getDate()} - ${we.getMonth()+1}.${we.getDate()}`;

  document.getElementById('weeklyTa').value = buildWeeklyReport(ws);
}

function buildWeeklyReport(weekStart) {
  const start = startOfDay(weekStart);
  const end   = new Date(start); end.setDate(start.getDate() + 6);

  const all    = getAllDayData();
  const inWeek = all.filter(x => x.date >= start && x.date <= end);
  const stats  = aggregate(inWeek);

  const allTasks  = inWeek.flatMap(x => x.tasks.map(t => Object.assign({}, t, { _date: x.date })));
  const completed = allTasks.filter(t => t.done).sort((a, b) => (a.doneAt || 0) - (b.doneAt || 0));
  const waiting   = allTasks.filter(t => !t.done)
    .sort((a, b) => PRI_META[a.pri || 'medium'].order - PRI_META[b.pri || 'medium'].order);

  const grouped = {};
  for (const t of completed) (grouped[t.cat] = grouped[t.cat] || []).push(t);

  const wkDays = ['日', '一', '二', '三', '四', '五', '六'];
  const fmtMD  = d => `${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
  const wkStr  = `${start.getFullYear()}年 ${start.getMonth()+1}月${start.getDate()}日 - ${end.getMonth()+1}月${end.getDate()}日`;
  const line   = n => '─'.repeat(n);

  let r = '';
  r += `【周工作报告】${wkStr}\n`;
  r += line(10) + '\n\n';

  r += `周统计\n`;
  r += `共安排 ${stats.total} 项，已完成 ${stats.done} 项，待完成 ${stats.pending} 项，完成率 ${stats.pct}%\n`;
  if (stats.totalMin) {
    r += `预估总时长 ${fmtMin(stats.totalMin)}，已完成时长 ${fmtMin(stats.doneMin) || '0分钟'}\n`;
  }
  r += '\n';

  r += `每日完成情况\n`;
  r += line(10) + '\n';
  for (let i = 0; i < 7; i++) {
    const d   = new Date(start); d.setDate(start.getDate() + i);
    const day = stats.byDay.find(x => x.date.getTime() === d.getTime());
    const lbl = `${fmtMD(d)} 周${wkDays[d.getDay()]}`;
    if (day && day.total) {
      const pct = Math.round(day.done / day.total * 100);
      r += `${lbl}：${day.done}/${day.total} 项（${pct}%）\n`;
    } else {
      r += `${lbl}：—\n`;
    }
  }
  r += '\n';

  if (completed.length > 0) {
    r += `本周已完成（${completed.length} 项）\n`;
    r += line(10) + '\n';
    let no = 1;
    for (const [cat, items] of Object.entries(grouped)) {
      const meta = CAT_META[cat];
      if (!meta) continue;
      r += `\n【${meta.label}】（${items.length} 项）\n`;
      for (const t of items) {
        const dStr = fmtMD(t._date);
        const dur  = t.min ? `（${fmtMin(t.min)}）` : '';
        r += `${no++}. [${dStr}] ${t.title}${dur}\n`;
        if (t.notes) r += `   备注：${t.notes}\n`;
      }
    }
    r += '\n';
  }

  if (waiting.length > 0) {
    r += `本周未完成（${waiting.length} 项）\n`;
    r += line(10) + '\n';
    waiting.forEach((t, i) => {
      const pri  = t.pri === 'high' ? '[高]' : t.pri === 'medium' ? '[中]' : '[低]';
      const dStr = fmtMD(t._date);
      const dur  = t.min ? `（${fmtMin(t.min)}）` : '';
      r += `${i+1}. ${pri} [${dStr}] ${t.title}${dur}\n`;
      if (t.notes) r += `   备注：${t.notes}\n`;
    });
    r += '\n';
  }

  r += `下周计划\n`;
  r += line(10) + '\n';
  r += `（请填写下周工作计划）\n\n`;

  r += `工作总结\n`;
  r += line(10) + '\n';
  if (stats.total === 0) {
    r += `本周暂无任务记录。\n`;
  } else if (stats.pct === 100) {
    r += `本周 ${stats.total} 项任务全部完成，效率优秀。\n`;
  } else if (stats.pct >= 80) {
    r += `本周完成率 ${stats.pct}%，整体进展良好。\n`;
  } else if (stats.pct >= 50) {
    r += `本周完成率 ${stats.pct}%，仍有 ${stats.pending} 项需继续跟进。\n`;
  } else {
    r += `本周完成率 ${stats.pct}%，待完成项较多，请加强推进。\n`;
  }

  return r;
}

function regenerateWeeklyReport() {
  if (confirm('重新生成将覆盖当前内容，是否继续？')) {
    renderWeekly();
    toast('🔄 周报已重新生成');
  }
}

function copyWeeklyReport() {
  const text = document.getElementById('weeklyTa').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text)
      .then(() => toast('📋 周报已复制到剪贴板'))
      .catch(() => toast('❌ 复制失败，请手动选中复制'));
  } else {
    document.getElementById('weeklyTa').select();
    document.execCommand('copy');
    toast('📋 周报已复制到剪贴板');
  }
}

function downloadWeeklyReport() {
  const text  = document.getElementById('weeklyTa').value;
  const today = startOfDay(NOW);
  const ws    = weekStartDate(today);
  ws.setDate(ws.getDate() + _weekOffset * 7);
  const name  = `周报_${ws.getFullYear()}${pad(ws.getMonth()+1)}${pad(ws.getDate())}.txt`;
  const blob  = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a     = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download: name,
  });
  a.click();
  URL.revokeObjectURL(a.href);
  toast('⬇️ 周报已导出');
}

/* ═══════════════════════════════════════════════
   Keyboard shortcuts
═══════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !e.isComposing) {
    // Close only the topmost open modal
    if (document.getElementById('editOverlay').classList.contains('is-open'))   { closeEdit();      return; }
    if (document.getElementById('reportOverlay').classList.contains('is-open')) { closeReport();    return; }
    if (document.getElementById('statsOverlay').classList.contains('is-open'))  { closeStats();     return; }
    if (document.getElementById('ltOverlay').classList.contains('is-open'))     { closeLongterm();  return; }
    if (document.getElementById('histOverlay').classList.contains('is-open'))   { closeHistory();   return; }
    closeForm();
  }
  // Ctrl/Cmd + Enter → submit add form
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    if (document.getElementById('addForm').classList.contains('is-open')) {
      submitTask();
    }
  }
});

/* ═══════════════════════════════════════════════
   Boot
═══════════════════════════════════════════════ */
migrateUnpaddedKeys();
loadTasks();
loadLongterm();
sortMode = localStorage.getItem('df_sortMode') || 'priority';
updateSortBadge();
render();

// Reload when the user returns on a new day
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const d = new Date();
  const liveKey = `df_${d.getFullYear()}_${pad(d.getMonth()+1)}_${pad(d.getDate())}`;
  if (liveKey !== DKEY) location.reload();
});

// Sync across tabs
window.addEventListener('storage', e => {
  if (e.key === DKEY)  { loadTasks();    render(); }
  if (e.key === LKEY)  { loadLongterm(); render(); }
});
</script>
